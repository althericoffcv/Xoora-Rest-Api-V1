<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>XOORA — REST API Platform</title>
  <meta name="description" content="XOORA is a REST API platform for developers: discover APIs, read the docs, test endpoints live and monitor API status in one place.">
  <meta name="theme-color" content="#f3f7ff">
  <meta name="color-scheme" content="light dark">

  <link rel="icon" href="/src/icon.png" type="image/png">
  <link rel="apple-touch-icon" href="/src/icon.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="XOORA">

  <!-- Applies the saved theme before first paint (light is the default) -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('xoora.theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#070d22');
        }
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://files.catbox.moe">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages.css">

  <!-- Start fetching config, scripts and key artwork in parallel.
       Image URLs mirror site.assets in src/settings.json; if you change those, update these hints too. -->

  <link rel="modulepreload" href="/assets/js/core/dom.js">
  <link rel="modulepreload" href="/assets/js/core/icons.js">

  <link rel="modulepreload" href="/assets/js/components/playground.js">
